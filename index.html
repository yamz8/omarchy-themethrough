<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Omarchy wordmark, laid on the floor and filled with every theme's backgrounds." />
    <title>omarchy · themethrough</title>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="grade"></div>
    <div id="bar-top" class="bar"></div>
    <div id="bar-bottom" class="bar"></div>

    <div id="fade"></div>

    <div id="hud">
      <div id="status">loading</div>
      <div class="buttons">
        <button id="play" type="button">
          <span class="glyph">&#9654;</span>
          <span class="label">play</span>
        </button>
        <button id="drive" type="button">
          <span class="glyph">&#9679;</span>
          <span class="label">drive</span>
        </button>
      </div>
    </div>

    <div id="keys">
      <span><b>W</b>&#8202;/&#8202;<b>S</b> throttle</span>
      <span><b>A</b>&#8202;/&#8202;<b>D</b> steer</span>
      <span><b>space</b> brake</span>
    </div>

    <aside id="theme-reveal" aria-hidden="true" aria-live="polite">
      <div class="reveal-kicker">theme chamber · <span id="cave-mood"></span></div>
      <h2 id="cave-theme"></h2>
      <p>Take this atmosphere back to your desktop.</p>
      <div class="command-row">
        <code id="theme-command"></code>
        <button id="copy-theme" type="button">copy command</button>
      </div>
    </aside>
  </body>
  <script type="module" src="/src/main.js"></script>
</html>
